<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pond of Memories</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FISHING FOR MEMORIES</h1>
        <p>Rippling water in a busy city...</p>
    </header>

    <main class="game">

        <section class="city">
            <div class="building">
                <h2>MEMORY MUSEUM</h2>
                <p id="doorMessage">The door is locked.</p>
                <a id="museumDoor" href="museum.html" >LOCKED
                </a>
            </div>
        </section>

        <section class="pond">
            <h2>MEMORY POND</h2>

            <div class="water">
                <img src="images/blue tang.png" alt="Blue tang fish" class="exhibit-fish">
                <img src="images/download (3).png" alt="Pacific fanfish" class="exhibit-fish">
               <img src="images/download.png" alt="Zebrafish" class="exhibit-fish">
                <img src="images/download (1).png" alt="Salmon" class="exhibit-fish">
                <img src="images/download (2).png" alt="Sunfish" class="exhibit-fish">
            </div>
        </section>

        <section class="fishing">
            <p id="message">
                There are memories hidden beneath the water.
            </p>

            <button id="fishButton">
               🎣CAST YOUR LINE 
            </button>

            <p id="counter">0/5 fish collected</p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
